x-backend-environment: &backend-environment
  # Only explicitly listed values are passed to containers. Compose reads .env
  # for interpolation, but never injects all profile credentials into every service.
  DATABASE_HOST: postgres
  DATABASE_USER: "${DATABASE_USER:-postgres}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD:-}"
  DATABASE_PORT: "${DATABASE_PORT:-5432}"
  SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:-}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
  JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
  COOKIE_SECURE: "${COOKIE_SECURE:-true}"
  CORS_ORIGINS: "${CORS_ORIGINS:-*}"
  FASTAPI_DOCS_URL: "${FASTAPI_DOCS_URL:-/docs}"
  FASTAPI_REDOC_URL: "${FASTAPI_REDOC_URL:-/redoc}"
  FASTAPI_OPENAPI_URL: "${FASTAPI_OPENAPI_URL:-/openapi.json}"
  AZURE_TRANSLATOR_ENDPOINT: "${AZURE_TRANSLATOR_ENDPOINT:-}"
  AZURE_TRANSLATOR_KEY: "${AZURE_TRANSLATOR_KEY:-}"
  AZURE_TRANSLATOR_REGION: "${AZURE_TRANSLATOR_REGION:-}"
  AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY:-}"
  AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION:-2024-07-01-preview}"
  AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT:-}"
  ASW_PROXY_URL: "${ASW_PROXY_URL:-}"
  HTTP_PROXY: "${HTTP_PROXY:-}"
  HTTPS_PROXY: "${HTTPS_PROXY:-}"
  http_proxy: "${http_proxy:-}"
  https_proxy: "${https_proxy:-}"
  NO_PROXY: "${NO_PROXY:-}"
  no_proxy: "${no_proxy:-}"
  MAIL_SERVER: "${MAIL_SERVER:-smtp.office365.com}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_FROM: "${MAIL_FROM:-}"
  DATABASE_AUTO_MIGRATE: "${DATABASE_AUTO_MIGRATE:-true}"
  DATABASE_AUTO_GENERATE_MIGRATIONS: "${DATABASE_AUTO_GENERATE_MIGRATIONS:-false}"
  DATABASE_BOOTSTRAP_SCHEMA: "${DATABASE_BOOTSTRAP_SCHEMA:-false}"
  BOOTSTRAP_DEFAULT_ADMIN: "${BOOTSTRAP_DEFAULT_ADMIN:-false}"
  BOOTSTRAP_DEFAULT_ADMIN_USERNAME: "${BOOTSTRAP_DEFAULT_ADMIN_USERNAME:-admin}"
  BOOTSTRAP_DEFAULT_ADMIN_PASSWORD: "${BOOTSTRAP_DEFAULT_ADMIN_PASSWORD:-}"
  SERVER_LOG_LEVEL: "${SERVER_LOG_LEVEL:-INFO}"
  SERVER_LOG_FORMAT: "${SERVER_LOG_FORMAT:-json}"
  SERVER_LOG_FILE: "${SERVER_LOG_FILE:-}"
  DATA_RETENTION_DAYS: "${DATA_RETENTION_DAYS:-30}"
  RETENTION_CHECK_INTERVAL_SECONDS: "${RETENTION_CHECK_INTERVAL_SECONDS:-86400}"
  MAX_WORKER_THREADS: "${MAX_WORKER_THREADS:-4}"
  EXTRACT_TOTAL_MODEL: "${EXTRACT_TOTAL_MODEL:-gpt-4.1-mini-CLS-DataUpload}"
  EXTRACT_TOTAL_TEMPERATURE: "${EXTRACT_TOTAL_TEMPERATURE:-0.0}"
  EXTRACT_TOTAL_RETRY_MODEL: "${EXTRACT_TOTAL_RETRY_MODEL:-gpt-4.1-CLS-DataUpload-SpecialCaseHandle}"
  EXTRACT_TOTAL_RETRY_TEMPERATURE: "${EXTRACT_TOTAL_RETRY_TEMPERATURE:-0.0}"
  NORMALIZE_KEYWORDS_MODEL: "${NORMALIZE_KEYWORDS_MODEL:-gpt-4.1-mini-CLS-DataUpload}"
  NORMALIZE_KEYWORDS_TEMPERATURE: "${NORMALIZE_KEYWORDS_TEMPERATURE:-0.2}"
  GENERATE_ACTIONS_MODEL: "${GENERATE_ACTIONS_MODEL:-gpt-4.1}"
  GENERATE_ACTIONS_TEMPERATURE: "${GENERATE_ACTIONS_TEMPERATURE:-0.2}"
  GENERATE_EMAIL_MODEL: "${GENERATE_EMAIL_MODEL:-gpt-4.1}"
  GENERATE_EMAIL_TEMPERATURE: "${GENERATE_EMAIL_TEMPERATURE:-0.25}"
  GENERATE_EMAIL_MAX_TOKENS: "${GENERATE_EMAIL_MAX_TOKENS:-10000}"
  GENERATE_STRATEGY_MODEL: "${GENERATE_STRATEGY_MODEL:-gpt-4.1}"
  GENERATE_STRATEGY_TEMPERATURE: "${GENERATE_STRATEGY_TEMPERATURE:-0.25}"
  GENERATE_STRATEGY_MAX_TOKENS: "${GENERATE_STRATEGY_MAX_TOKENS:-10000}"

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: *backend-environment
  networks:
    - connex_network
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "10"

