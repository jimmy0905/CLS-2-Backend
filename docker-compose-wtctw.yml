services:
  wtctw-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wtctw_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    networks:
      - connex_network
    volumes:
      - upload_tasks:/app/upload_tasks

volumes:
  upload_tasks:
    driver: local

networks:
  connex_network:
    external: true