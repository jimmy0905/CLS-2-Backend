cubes:
  - name: survey_assignments
    title: Survey assignment combinations
    description: >-
      One row per survey-to-(keyword, department, topic) combination. A response
      repeats once per product of its assignment counts, so only measures that
      deduplicate on distinct_survey_id are meaningful at this grain. Response
      averages such as CLS are deliberately absent.
    sql_table: analytics_survey_assignments

    measures:
      - name: combination_count
        type: count

      - name: survey_count
        sql: distinct_survey_id
        type: count_distinct
        meta:
          query_target: survey
          public_aggregation: count
          entity: survey

      - name: responding_store_count
        sql: store_key
        type: count_distinct
        meta:
          query_target: store
          public_aggregation: count
          entity: store

      - name: topic_sentiment_positive_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_sentiment = 'POSITIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: topic_sentiment_negative_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_sentiment = 'NEGATIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: topic_sentiment_neutral_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_sentiment = 'NEUTRAL' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: topic_sentiment_mixed_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_sentiment = 'MIXED' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: keyword_sentiment_positive_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.keyword_sentiment = 'POSITIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: keyword_sentiment_negative_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.keyword_sentiment = 'NEGATIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: keyword_sentiment_neutral_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.keyword_sentiment = 'NEUTRAL' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: department_sentiment_positive_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.department_sentiment = 'POSITIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: department_sentiment_negative_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.department_sentiment = 'NEGATIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: department_sentiment_neutral_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.department_sentiment = 'NEUTRAL' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: topic_assignment_sentiment_positive_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_assignment_sentiment = 'POSITIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: topic_assignment_sentiment_negative_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_assignment_sentiment = 'NEGATIVE' THEN {CUBE}.distinct_survey_id END)
        type: number

      - name: topic_assignment_sentiment_neutral_survey_count
        sql: COUNT(DISTINCT CASE WHEN {CUBE}.topic_assignment_sentiment = 'NEUTRAL' THEN {CUBE}.distinct_survey_id END)
        type: number

      # __LOCAL_MEASURES__

    dimensions:
      - name: combination_id
        sql: combination_id
        type: string
        primary_key: true
        public: true

      - name: survey_id
        sql: survey_id
        type: string

      - name: response_id
