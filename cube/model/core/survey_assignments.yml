      # __LOCAL_DIMENSIONS__

    pre_aggregations:
      - name: daily_topic_departments
        measures:
          - survey_count
          - topic_sentiment_positive_survey_count
          - topic_sentiment_negative_survey_count
          - topic_sentiment_neutral_survey_count
          - topic_sentiment_mixed_survey_count
        dimensions:
          - topic
          - department
        time_dimension: reported_at
        granularity: day
        partition_granularity: month
        scheduled_refresh: true
        refresh_key:
          every: __PRE_AGGREGATION_REFRESH_EVERY__

      # __LOCAL_PREAGGREGATIONS__
