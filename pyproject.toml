[tool.ruff]
target-version = "py311"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["core", "features", "infrastructure", "models", "routers", "utils"]

[tool.ruff.lint.per-file-ignores]
"backend/features/**/endpoints/*.py" = ["B008"]
"backend/features/**/endpoint.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
files = [
    "backend/core/errors.py",
    "backend/core/openapi.py",
    "backend/features/master_data/dto.py",
    "backend/features/master_data/mapper.py",
    "backend/features/master_data/repository.py",
    "backend/features/master_data/service.py",
    "backend/core/security.py",
    "backend/features/translation/dto.py",
    "backend/features/translation/service.py",
    "backend/features/operations/lifecycle.py",
    "backend/features/operations/service.py",
]
mypy_path = ["backend"]
explicit_package_bases = true
follow_imports = "normal"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["alembic.*", "jose.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["requests"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "features.analytics.*",
    "features.identity.service.security",
    "infrastructure.database.base",
    "infrastructure.database.dbo.*",
    "infrastructure.database.session",
    "infrastructure.integrations.translation",
]
follow_imports = "skip"
